[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgit"
version = "0.1.0"
description = "Version control from scratch: git-compatible objects, Myers diff, 3-way merge, HTTP sync"
requires-python = ">=3.10"
dependencies = []   # the client is pure standard library

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
mgit = "mgit.cli:main"

[tool.setuptools]
packages = ["mgit", "server"]
